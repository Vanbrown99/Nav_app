name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.8
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href /Nav_app/

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyetam-web
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyetam-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  backend:
    name: FastAPI quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Test API
        env:
          SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
          DATABASE_URL: sqlite:///./ci.db
        run: python -m pytest -q

      - name: Verify application imports
        run: python -c "from app.main import app; assert app.title == 'Nyetam Tourism API'"
